<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Party</title>
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        background: linear-gradient(120deg, #0f2027 0%, #2c5364 50%, #2196f3 100%);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0.98;
        background-size: 400% 400%;
        animation: moveBg 16s ease-in-out infinite;
        position: relative;
        overflow: hidden;
    }
    @keyframes moveBg {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }
    body::before, body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        opacity: 0.22;
        pointer-events: none;
        z-index: 0;
    }
    body::before {
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, #2196f3 0%, transparent 70%);
        top: -220px;
        left: -220px;
        animation: float1 18s linear infinite alternate;
    }
    body::after {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, #64b5f6 0%, transparent 70%);
        bottom: -120px;
        right: -100px;
        animation: float2 22s linear infinite alternate;
    }
    @keyframes float1 {
        0% {transform: translateY(0);}
        100% {transform: translateY(60px);}
    }
    @keyframes float2 {
        0% {transform: translateY(0);}
        100% {transform: translateY(-40px);}
    }
    .container {
        position: relative;
        z-index: 1;
        background: rgba(26, 35, 126, 0.7);
        border-radius: 20px;
        padding: 2rem 3rem;
        box-shadow: 0 8px 32px 0 rgba(33, 150, 243, 0.37);
        text-align: center;
        backdrop-filter: blur(6px);
    }
    h1 {
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 1rem;
    }
    p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
    }
    .btn {
        background: #2196f3;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0.8rem 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(33,150,243,0.2);
        transition: background 0.2s, transform 0.2s;
    }
    .btn:hover {
        background: #1769aa;
        transform: translateY(-2px) scale(1.04);
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>LanForge</h1>
        <p>Wilkommen zur Lan Forge<br>
            Sei dabei, wenn Gaming und Spaß aufeinandertreffen.</p>
        <button class="btn">Start</button>
    </div>
</body>
</html>
